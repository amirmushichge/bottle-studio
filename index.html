<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottle Studio</title>
<meta name="description" content="A premium whisky bottle studio in one HTML file: parametric glass, see-through whisky, studio light, lens bokeh and a hero type layer. Built with three.js by Amir Mushich.">
<meta property="og:title" content="Bottle Studio">
<meta property="og:description" content="Shape, light and shoot a premium bottle in the browser, then try your hero type behind it.">
<meta property="og:image" content="https://amirmushichge.github.io/bottle-studio/assets/poster.jpg">
<meta property="og:url" content="https://amirmushichge.github.io/bottle-studio/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:creator" content="@AmirMushich">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  /* Stage first: full-bleed WebGL, a hairline control column on the right, shot names bottom-centre, Details in the corner.
     Interface type is Inter Regular only, tracked -0.06em. Cormorant is used only inside the product artwork. */
  color-scheme: dark;
  --void:#0a0807;
  --glass:rgba(14,11,10,.34);
  --hair:rgba(255,255,255,.085);
  --text:rgba(255,250,246,.92);
  --muted:rgba(255,250,246,.46);
  --faint:rgba(255,250,246,.17);
  --ui:"Inter", "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--text);font:400 12px/1.35 var(--ui);letter-spacing:-.06em;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,output,label,dialog,h2{font:inherit;letter-spacing:inherit;color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

.rail{position:fixed;right:20px;top:20px;bottom:20px;width:232px;display:flex;flex-direction:column;
  background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.1);backdrop-filter:blur(26px) saturate(1.1);
  border:1px solid var(--hair);border-radius:3px;overflow:hidden}
.rail-head{display:flex;justify-content:space-between;align-items:baseline;padding:16px 18px 13px}
.rail-head span{color:var(--muted);font-variant-numeric:tabular-nums}
.rail-body{overflow:auto;padding:0 18px 6px;scrollbar-width:none}
.rail-body::-webkit-scrollbar{display:none}
.sec{padding:14px 0 17px;border-top:1px solid var(--hair);display:grid;gap:13px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline}
.sec-h h2{margin:0;color:var(--muted)}
.sec-h output{color:var(--text);font-variant-numeric:tabular-nums}

.seg{display:flex;gap:15px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;color:var(--muted);padding:1px 0 3px;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--text)}

.sw{display:flex;gap:12px;flex-wrap:wrap;padding:3px 3px 2px}
.sw button{all:unset;cursor:pointer;width:12px;height:12px;border-radius:50%;position:relative;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.3)}
.sw button::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid transparent;transition:border-color .2s}
.sw button:hover::after{border-color:var(--faint)}
.sw button[aria-pressed="true"]::after{border-color:var(--text)}

.rng{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:baseline}
.rng label{color:var(--muted)}
.rng output{font-variant-numeric:tabular-nums}
.rng input{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:13px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:linear-gradient(90deg,var(--text) var(--p,50%),var(--faint) var(--p,50%))}
input[type=range]::-moz-range-track{height:1px;background:var(--faint)}
input[type=range]::-moz-range-progress{height:1px;background:var(--text)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:11px;margin-top:-5px;border:0;border-radius:0;
  background:linear-gradient(90deg,transparent 4px,var(--text) 4px 5px,transparent 5px)}
input[type=range]::-moz-range-thumb{width:9px;height:11px;border:0;border-radius:0;background:linear-gradient(90deg,transparent 4px,var(--text) 4px 5px,transparent 5px)}
input[type=range]:disabled{opacity:.3;cursor:not-allowed}

.tog{display:flex;justify-content:space-between;align-items:center;color:var(--muted)}
.tog button{all:unset;cursor:pointer;width:20px;height:10px;border-radius:10px;border:1px solid var(--faint);position:relative;transition:border-color .2s}
.tog button::after{content:"";position:absolute;top:2px;left:2px;width:6px;height:6px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.tog button[aria-pressed="true"]{border-color:var(--text)}
.tog button[aria-pressed="true"]::after{transform:translateX(10px);background:var(--text)}

.actions{display:flex;justify-content:space-between;padding:13px 18px 15px;border-top:1px solid var(--hair)}
.btn{all:unset;cursor:pointer;color:var(--muted);transition:color .2s}
.btn:hover,.btn.primary{color:var(--text)}

.shots{position:fixed;left:50%;transform:translateX(calc(-50% - 126px));bottom:24px;display:flex;gap:18px}
.shots button{all:unset;cursor:pointer;color:var(--muted);padding:4px 0;white-space:nowrap;transition:color .2s}
.shots button:hover,.shots button[aria-pressed="true"]{color:var(--text)}

.details{position:fixed;left:22px;bottom:24px}
.details > button{all:unset;cursor:pointer;color:var(--muted);opacity:.5;padding:4px 0;transition:opacity .2s}
.details > button:hover,.details > button[aria-expanded="true"]{opacity:1}
.details .panel{position:absolute;left:0;bottom:28px;width:max-content;max-width:min(320px,80vw);padding:11px 13px;background:var(--glass);
  -webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border:1px solid var(--hair);border-radius:3px;color:var(--muted);line-height:1.65;font-variant-numeric:tabular-nums}
.details .panel[hidden]{display:none}
.details .panel b{font-weight:400;color:var(--text)}
.details .credit{margin-top:9px;padding-top:9px;border-top:1px solid var(--hair)}
.details .credit a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--faint)}
.details .credit a:hover{border-bottom-color:var(--text)}

button:focus-visible,input:focus-visible{outline:1px solid var(--text);outline-offset:3px}

.veil{position:fixed;inset:0;background:var(--void);display:grid;place-items:center;transition:opacity 1.1s ease;z-index:5}
.veil.gone{opacity:0;pointer-events:none}
.veil p{color:var(--muted)}
.veil.err p{color:#f3b7a6;max-width:46ch;line-height:1.5;text-align:center}

dialog{border:1px solid var(--hair);background:#0e0b0a;color:var(--text);border-radius:3px;padding:14px;max-width:min(92vw,980px)}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog img{display:block;max-width:100%;max-height:72vh}
dialog footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;color:var(--muted)}

.txt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline}
.txt label{color:var(--muted)}
.txt input{all:unset;min-width:0;text-align:right;color:var(--text);border-bottom:1px solid var(--faint);padding:1px 0 3px;transition:border-color .2s}
.txt input:focus{border-bottom-color:var(--text)}
.file{display:flex;justify-content:space-between;align-items:baseline;gap:12px;position:relative}
.file label{cursor:pointer;color:var(--text);border-bottom:1px solid var(--faint);padding-bottom:2px;white-space:nowrap;transition:border-color .2s}
.file label:hover{border-bottom-color:var(--text)}
.file:focus-within label{outline:1px solid var(--text);outline-offset:3px}
.file span{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.sec [hidden]{display:none!important}
body.dropping #gl{outline:1px solid var(--text);outline-offset:-12px}
.sheet-toggle{display:none}

.light-stage .shots button,.light-stage .details > button{color:rgba(24,19,16,.5)}
.light-stage .shots button:hover,.light-stage .shots button[aria-pressed="true"],.light-stage .details > button{color:rgba(24,19,16,.92)}

@media (max-width:760px){
  .rail{left:0;right:0;top:auto;bottom:0;width:auto;height:min(52%,430px);border-radius:0;border-width:1px 0 0;
    transform:translateY(calc(100% - 46px));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .rail.open{transform:none}
  .sheet-toggle{display:block;all:unset;cursor:pointer;color:var(--text)}
  .desk-only{display:none}
  .rail-head{padding:15px 18px}
  .shots{transform:translateX(-50%);bottom:62px;max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none}
  .details{left:16px;top:14px;bottom:auto}
  .details .panel{top:26px;bottom:auto}
}
@media (prefers-reduced-motion:reduce){ .veil,.rail{transition:none} }
</style>

<body>
<canvas id="gl" tabindex="0" aria-label="3D bottle stage. Drag to orbit, scroll or pinch to zoom, keys 1 to 6 switch camera shots."></canvas>

<nav class="shots" id="shots" aria-label="Camera shots"></nav>
<div class="details">
  <button type="button" id="detailsBtn" aria-expanded="false" aria-controls="hud">Details</button>
  <div class="panel" id="hud" hidden><div id="hudStats"></div><div class="credit">Made by <a href="https://x.com/AmirMushich">Amir Mushich</a> · <a href="https://github.com/amirmushichge/bottle-studio">Source on GitHub</a></div></div>
</div>

<aside class="rail" id="rail" aria-label="Configure bottle and scene">
  <div class="rail-head">
    <button class="sheet-toggle" id="sheetToggle" aria-expanded="false">Configure</button>
    <span class="desk-only" style="color:var(--text)">Configure</span>
    <span id="dims">—</span>
  </div>
  <div class="rail-body" id="controls"></div>
  <div class="actions">
    <button class="btn" id="resetBtn">Reset</button>
    <button class="btn primary" id="snapBtn">Snapshot</button>
  </div>
</aside>

<dialog id="snap">
  <img id="snapImg" alt="Rendered snapshot of the bottle">
  <footer><span>Right-click or long-press the image to save it.</span><button class="btn" id="snapClose">Close</button></footer>
</dialog>

<div class="veil" id="veil"><p id="veilText">Blowing the glass…</p></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = s => document.querySelector(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MM = 100; // 1 scene unit = 100 mm

function fail(msg){ const v=$('#veil'); v.classList.add('err'); v.classList.remove('gone'); $('#veilText').textContent = msg; }

// ───────────────────────────── state
const DEFAULTS = {
  sides:3, corner:0.30, shoulder:0.60, H:2.6, R:0.56, neckR:0.155,
  glass:'ember', frost:0.0, liquid:'malt', fill:0.80, closure:'lacquer', foil:'gold',
  light:'ember', lightRot:0, exposure:1.0, mm:85, aperture:0.5, reflect:0.35, turntable:false,
  bd:'wordmark', bdTitle:'Ardlow', bdLine:'Single malt', bdInk:'cream', bdSize:0.9, bdY:0.56,
};
const S = structuredClone(DEFAULTS);

// ───────────────────────────── presets
const GLASS = {
  ember:   { name:'Ember',   swatch:'#b3200f', color:'#ffb49c', att:'#c8603c', dist:1.5 },
  smoke:   { name:'Smoke',   swatch:'#5d4c40', color:'#d9c6b4', att:'#5e4535', dist:0.9 },
  flint:   { name:'Flint',   swatch:'#dfe6e6', color:'#ffffff', att:'#ffffff', dist:Infinity },
  emerald: { name:'Emerald', swatch:'#1d6b44', color:'#9fe0b8', att:'#0b6a3a', dist:0.6 },
  cobalt:  { name:'Cobalt',  swatch:'#23379a', color:'#9db4ff', att:'#1a3398', dist:0.6 },
};
const LIQUID = {
  malt:   { name:'Single malt', swatch:'#b8621c', color:'#2e1004', glow:'#ff7a22', g:0.3, tint:'#ffb87a', trans:0.8 },
  sherry: { name:'Sherry cask', swatch:'#6e1c0c', color:'#1c0503', glow:'#d8381a', g:0.45, tint:'#ff7a48', trans:0.48 },
  peated: { name:'Peated',      swatch:'#5a3a1a', color:'#1d1206', glow:'#b8742f', g:0.3, tint:'#c89058', trans:0.34 },
  empty:  { name:'Empty',       swatch:'transparent' },
};
const CLOSURE = {
  lacquer:{ name:'Black lacquer', swatch:'#141010' },
  gold:   { name:'Brushed gold',  swatch:'#d6a75a' },
  oak:    { name:'Oak',           swatch:'#8a5a32' },
  copper: { name:'Copper',        swatch:'#b8653e' },
};
const FOIL = {
  gold:  { name:'Gold foil',   swatch:'#e3b56a', color:'#f0c27a' },
  silver:{ name:'Silver foil', swatch:'#cfd3d8', color:'#e4e7ea' },
  rose:  { name:'Rose foil',   swatch:'#dc9d86', color:'#f0b39a' },
};
// light rigs: backdrop gradient, screen-space halo behind the bottle, env lightformers [color, intensity, w, h, x, y, z]
const LIGHTS = {
  ember: { name:'Ember', top:'#170302', mid:'#3a0804', floor:'#0d0302', halo:'#ff3a10', haloStr:0.8, haloSize:0.62, pool:'#4a0a02',
    exposure:1.0, bloom:[0.32,0.4,1.4], glow:1.0, key:['#ffe2cc',1.6], rim:['#ff4a1a',2.4], dome:['#2a0503',0.35],
    forms:[['#fff2e6',10,0.35,5,-2.6,1.7,1.4],['#ffd6b8',6,0.22,5,2.6,1.7,1.0],['#ffffff',1.4,3,3,0,5.5,0.4],['#ff3a12',3.2,5,3.5,0,1.5,-3.6],['#ffd9b8',2.2,3.6,2.8,-1.9,1.3,4.4],['#ff8a5a',0.35,3,1.2,1.5,0.6,4]] },
  studio:{ name:'Studio', top:'#cfcac5', mid:'#b5aea8', floor:'#9f9892', halo:'#ffffff', haloStr:0.28, haloSize:1.1, pool:'#2a2724',
    exposure:0.95, bloom:[0.18,0.4,1.6], glow:0.75, key:['#ffffff',2.2], rim:['#ffffff',1.2], dome:['#bdb7b1',0.9],
    forms:[['#ffffff',6,1.2,5,-3,2,1.5],['#ffffff',5,1.2,5,3,2,1.5],['#ffffff',3,4,4,0,6,0],['#ffffff',2,4,3,0,1.5,-4]] },
  noir:  { name:'Noir', top:'#040405', mid:'#09090b', floor:'#030303', halo:'#8aa0ff', haloStr:0.18, haloSize:0.7, pool:'#06070c',
    exposure:1.05, bloom:[0.55,0.35,1.1], glow:0.55, key:['#dfe6ff',0.9], rim:['#ffffff',3.0], dome:['#000000',0],
    forms:[['#ffffff',14,0.12,6,-2.4,1.8,-1.2],['#e8eeff',12,0.12,6,2.4,1.8,-1.4],['#ffffff',0.6,2,0.6,0,4.5,1]] },
  dusk:  { name:'Dusk', top:'#1a1230', mid:'#8a3c1c', floor:'#120a08', halo:'#ffb24a', haloStr:1.4, haloSize:1.0, pool:'#3a1606',
    exposure:1.0, bloom:[0.4,0.6,1.3], glow:1.1, key:['#ffb070',2.0], rim:['#ffcf80',2.6], dome:['#3a1a2a',0.5],
    forms:[['#ffd29a',8,0.5,4,-3,1.4,-1],['#9a8aff',2,0.3,5,2.8,1.8,1.2],['#ffb060',4,6,2,0,0.6,-4],['#ffffff',0.8,3,3,0,5.5,0]] },
};
// camera shots: direction from target, framed world height, focal length
const SHOTS = [
  { id:'hero',     name:'Hero',     dir:[0.42,0.20,1],  tgt:[0,1.36,0],  frame:3.7, mm:85 },
  { id:'front',    name:'Front',    dir:[0,0.03,1],     tgt:[0,1.38,0],  frame:3.5, mm:85 },
  { id:'macro',    name:'Macro',    dir:[0.24,0.06,1],  tgt:[0,0.99,0],  frame:1.25, mm:105, ap:0.85 },
  { id:'shoulder', name:'Shoulder', dir:[-0.45,0.38,1], tgt:[0,1.74,0],  frame:1.1, mm:100, ap:0.75 },
  { id:'low',      name:'Low',      dir:[-0.7,0.03,1],  tgt:[0,1.45,0],  frame:3.6,  mm:35 },
  { id:'profile',  name:'Profile',  dir:[1,0.12,0.18],  tgt:[0,1.30,0],  frame:3.3,  mm:85 },
];

// ───────────────────────────── renderer / scene
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias:false, powerPreference:'high-performance' });
} catch(e){ fail('WebGL is not available in this browser, so the 3D stage cannot start. Try a recent Chrome, Edge, Safari or Firefox.'); throw e; }
const DPR = Math.min(devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.info.autoReset = false;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(20, innerWidth/innerHeight, 0.05, 140);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 0.9; controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI/2 - 0.015;
controls.autoRotateSpeed = 0.9;

// ───────────────────────────── contour (cross-section), arc-length parametrised, u=0.5 faces +z
const CIRC = 0.8, TABLE = 1024;
let contour = { table:null, L:1 };
function buildContour(sides, corner){
  const dense = [];
  if (sides === 0){
    const n = 720;
    for (let i=0;i<=n;i++){ const t = Math.PI/2 + i/n*Math.PI*2; dense.push([Math.cos(t)*CIRC, Math.sin(t)*CIRC]); }
  } else {
    const a = 1 - corner, rho = corner, half = Math.PI/sides;
    const ap = a*Math.cos(half) + rho;
    dense.push([0, ap]);
    for (let k=0;k<sides;k++){
      const al = Math.PI/2 + half + k*2*half, vx = a*Math.cos(al), vz = a*Math.sin(al);
      for (let s=0;s<=96;s++){ const th = al - half + (s/96)*2*half; dense.push([vx + rho*Math.cos(th), vz + rho*Math.sin(th)]); }
    }
    dense.push([0, ap]);
  }
  const cum = [0];
  for (let i=1;i<dense.length;i++) cum.push(cum[i-1] + Math.hypot(dense[i][0]-dense[i-1][0], dense[i][1]-dense[i-1][1]));
  const L = cum[cum.length-1];
  const out = new Float32Array((TABLE+1)*2);
  for (let j=0;j<=TABLE;j++){
    let s = ((0.5 - j/TABLE) * L) % L; if (s < 0) s += L;
    let lo = 0, hi = cum.length-1;
    while (hi - lo > 1){ const mid = (lo+hi)>>1; if (cum[mid] <= s) lo = mid; else hi = mid; }
    const t = (s - cum[lo]) / Math.max(1e-9, cum[hi]-cum[lo]);
    out[2*j]   = dense[lo][0] + (dense[hi][0]-dense[lo][0])*t;
    out[2*j+1] = dense[lo][1] + (dense[hi][1]-dense[lo][1])*t;
  }
  contour = { table: out, L };
}
function contourAt(u){
  u -= Math.floor(u);
  const f = u*TABLE, i = Math.min(TABLE-1, Math.floor(f)), t = f - i, T = contour.table;
  return [T[2*i] + (T[2*i+2]-T[2*i])*t, T[2*i+1] + (T[2*i+3]-T[2*i+1])*t];
}

// ───────────────────────────── vertical profile: width w(y) and polygon→circle morph m(y)
const smooth = (a,b,x)=>{ const t = Math.min(1, Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
function levels(){
  const yb = S.H*S.shoulder, ys = yb + S.H*0.19;
  return { yb, ys, wn: S.neckR/CIRC, bev:0.05, capY: S.H - 0.36 };
}
function prof(y){
  const { yb, ys, wn, bev } = levels(), R = S.R;
  if (y < bev){ const d = bev - y; return [R - bev + Math.sqrt(Math.max(0, bev*bev - d*d)), 0]; }
  if (y < yb) return [R*(1 - 0.012*(y/yb)), 0];
  if (y < ys){
    const t = (y-yb)/(ys-yb), Rt = R*0.988;
    const e = Math.pow(smooth(0,1,t), 0.9);
    return [Rt + (wn - Rt)*e, smooth(0.0, 0.8, t)];
  }
  // neck with a gentle taper and a finishing bead just under the cap
  const tn = (y-ys)/(S.H-ys);
  const bead = Math.exp(-Math.pow((y - (S.H-0.43))/0.018, 2))*0.022;
  return [wn*(1 - 0.035*tn) + bead/CIRC, 1];
}
function surf(u, y, inset, out){

    vec4 t = texture2D(uBd, clamp(q, 0.0, 1.0));
    float inside = step(0.0, q.x) * step(q.x, 1.0) * step(0.0, q.y) * step(q.y, 1.0);

  uBd:{value:null}, uBdOn:{value:0}, uBdW:{value:0.7}, uAspect:{value:1}, uBdC:{value:new THREE.Vector2(0.5,0.5)}, uBdInk:{value:new THREE.Color(1,1,1)},

const INK = {
  cream:{ name:'Cream', swatch:'#efe2d2', color:'#f6e8d8', k:1.45 },
  gold: { name:'Gold',  swatch:'#d6a65c', color:'#ecbb6c', k:1.3 },

function drawBackdrop(){

    const widthAt = sz => { g.font = font(sz); return [...title].reduce((a,ch)=>a+g.measureText(ch).width,0) + 0.14*sz*Math.max(0,title.length-1); };
    const size = Math.min(780, 600 * (BD_W*0.9) / Math.max(1, widthAt(600)));

      g.font = font(size); g.lineWidth = Math.max(3, size*0.011);

      g.beginPath(); g.moveTo(BD_W/2, ry-dd); g.lineTo(BD_W/2+dd, ry); g.lineTo(BD_W/2, ry+dd); g.lineTo(BD_W/2-dd, ry); g.closePath(); g.fill();

const rig = new THREE.Group(); scene.add(rig);

const softTex = {};

function softbox(round){
  if (softTex[round]) return softTex[round];

  const g = c.getContext('2d'), img = g.createImageData(n, n);
  const sm = (a,b,x)=>{ const t = Math.min(1, Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
  for (let y=0;y<n;y++) for (let x=0;x<n;x++){
    const u = (x+0.5)/n*2-1, v = (y+0.5)/n*2-1;
    const val = round ? (1 - sm(0.5, 1.0, Math.hypot(u, v))) * (0.85 + 0.15*(1 - u*u - v*v))
                      : (1 - sm(0.68, 1.0, Math.abs(u))) * (1 - sm(0.82, 1.0, Math.abs(v))) * (0.9 + 0.1*(1 - u*u));

const QUAD_VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
const DOF_COMMON = `uniform sampler2D tDepth; uniform float uNear, uFar, uFocus, uScale, uMax;
#include <packing>
float getZ(vec2 uv){ return -perspectiveDepthToViewZ(texture2D(tDepth, uv).x, uNear, uFar); }
float cocOf(float z){ return clamp(abs(1.0 - uFocus/z) * uScale, 0.0, uMax); }
uniform sampler2D uBd; uniform float uBdOn, uBdW, uAspect; uniform vec2 uBdC;
vec2 heroQ(vec2 suv){ return vec2((suv.x - uBdC.x)/uBdW, (suv.y - uBdC.y)/(uBdW*uAspect*0.5)) + 0.5; }

// hero coverage of a background pixel (the bottle in front hides it): z beyond the product means backdrop or far floor

    this.halfRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
    this.depthMat = new THREE.MeshBasicMaterial({ colorWrite:false });
    const u = () => ({ tDepth:{value:null}, uNear:{value:0.05}, uFar:{value:140}, uFocus:{value:8}, uScale:{value:10}, uMax:{value:12},
      uBd:bgUniforms.uBd, uBdOn:bgUniforms.uBdOn, uBdW:bgUniforms.uBdW, uAspect:bgUniforms.uAspect, uBdC:bgUniforms.uBdC });

let tween = null, activeShot = 'hero';
function shotPose(s){
  const fov = THREE.MathUtils.degToRad(fovFor(s.mm));
  const d = s.frame / (2*Math.tan(fov/2));
  const dir = new THREE.Vector3(...s.dir).normalize();
  const tgt = new THREE.Vector3(...s.tgt);
  return { tgt, dir, d, mm:s.mm };
}
function goShot(id, dur=1.25, fromScale=1){
  const s = SHOTS.find(x=>x.id===id); activeShot = id;
  const to = shotPose(s);
  if (s.ap) setAperture(s.ap); else if (S.aperture > 0.7) setAperture(DEFAULTS.aperture);
  const off = camera.position.clone().sub(controls.target);
  const from = { tgt: controls.target.clone(), dir: off.clone().normalize(), d: off.length()*fromScale, mm: S.mm };
  S.mm = to.mm; syncUI();
  if (reduceMotion || dur === 0){ applyPose(to, 1, to); tween = null; }
  else tween = { from, to, t:0, dur };
  document.querySelectorAll('#shots button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id===id));
}
const ease = t => t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
function applyPose(a, k, b){
  const tgt = a.tgt.clone().lerp(b.tgt, k);
  const dir = a.dir.clone().lerp(b.dir, k).normalize();
  const d = THREE.MathUtils.lerp(a.d, b.d, k);
  const mm = THREE.MathUtils.lerp(a.mm, b.mm, k);
  camera.fov = fovFor(mm); camera.updateProjectionMatrix();
  controls.target.copy(tgt); camera.position.copy(tgt).addScaledVector(dir, d);
}
controls.addEventListener('start', () => { tween = null; activeShot = null; document.querySelectorAll('#shots button').forEach(b => b.setAttribute('aria-pressed','false')); });
function setAperture(v){ S.aperture = v; syncUI(); }

// ───────────────────────────── UI
const ctl = $('#controls');
const fmtMM = v => `${Math.round(v*MM)} mm`;
const SPEC = [
  { h:'Backdrop', out:()=> S.bd==='off' ? 'Off' : S.bd==='image' ? 'Artwork' : 'Wordmark', items:[
    { t:'seg', k:'bd', opts:[['wordmark','Wordmark'],['image','Artwork'],['off','Off']], on:()=>{ applyBackdrop(); if (S.bd==='image' && !bdImage) $('#c-file').click(); } },
    { t:'text', k:'bdTitle', label:'Title', show:()=> S.bd==='wordmark', on:applyBackdrop },
    { t:'text', k:'bdLine', label:'Line', show:()=> S.bd==='wordmark', on:applyBackdrop },
    { t:'sw', k:'bdInk', src:INK, show:()=> S.bd==='wordmark', on:applyBackdrop },
    { t:'file', label:'Upload PNG / SVG', show:()=> S.bd!=='off' },
    { t:'rng', k:'bdSize', label:'Width', min:0.3, max:1.4, step:0.005, f:v=>`${Math.round(v*100)}% of stage`, on:()=>{}, show:()=> S.bd!=='off' },
    { t:'rng', k:'bdY', label:'Vertical position', min:0.1, max:0.9, step:0.005, f:v=>`${Math.round(v*100)}%`, on:()=>{}, show:()=> S.bd!=='off' },
  ]},
  { h:'Form', out:()=> S.sides===3?'Tri':S.sides===4?'Square':'Round', items:[
    { t:'seg', k:'sides', opts:[[3,'Tri'],[4,'Square'],[0,'Round']], on:rebuildAll },
    { t:'rng', k:'corner', label:'Corner radius', min:0.12, max:0.48, step:0.01, f:v=>fmtMM(v*S.R), on:scheduleShape, done:redrawBump, dis:()=> S.sides===0 },
    { t:'rng', k:'shoulder', label:'Shoulder height', min:0.5, max:0.68, step:0.005, f:v=>fmtMM(v*S.H), on:scheduleShape, done:redrawBump },
    { t:'rng', k:'R', label:'Body width', min:0.44, max:0.66, step:0.005, f:v=>fmtMM(v*2), on:scheduleShape, done:redrawBump },
  ]},
  { h:'Glass', out:()=> GLASS[S.glass].name, items:[
    { t:'sw', k:'glass', src:GLASS, on:applyGlass },
    { t:'rng', k:'frost', label:'Frost', min:0, max:0.35, step:0.005, f:v=> v<0.02?'Polished':v<0.12?'Satin':'Frosted', on:applyGlass },
  ]},
  { h:'Liquid', out:()=> LIQUID[S.liquid].name, items:[
    { t:'sw', k:'liquid', src:LIQUID, on:applyLiquid },
    { t:'rng', k:'fill', label:'Fill level', min:0, max:1, step:0.005, f:()=> `${Math.round(capacity().fill)} ml`, on:applyLiquid },
  ]},
  { h:'Closure & foil', out:()=> `${CLOSURE[S.closure].name.split(' ').pop()} · ${FOIL[S.foil].name.split(' ')[0]}`, items:[
    { t:'sw', k:'closure', src:CLOSURE, on:applyClosure },
    { t:'sw', k:'foil', src:FOIL, on:applyFoil },
  ]},
  { h:'Light', out:()=> LIGHTS[S.light].name, items:[
    { t:'seg', k:'light', opts:Object.entries(LIGHTS).map(([k,v])=>[k,v.name]), on:applyLight },
    { t:'rng', k:'lightRot', label:'Rig rotation', min:-180, max:180, step:1, f:v=>`${v}°`, on:applyRot },
    { t:'rng', k:'exposure', label:'Exposure', min:0.4, max:2, step:0.01, f:v=>`${(Math.log2(v)>=0?'+':'')}${Math.log2(v).toFixed(1)} EV`, on:()=>{ renderer.toneMappingExposure = S.exposure*LIGHTS[S.light].exposure; } },
    { t:'rng', k:'reflect', label:'Floor reflection', min:0, max:0.8, step:0.01, f:v=>`${Math.round(v*100)}%`, on:applyReflect },
  ]},
  { h:'Lens', out:()=> `${Math.round(S.mm)} mm`, items:[
    { t:'rng', k:'mm', label:'Focal length', min:24, max:135, step:1, f:v=>`${Math.round(v)} mm`, on:()=> setLens(S.mm) },
    { t:'rng', k:'aperture', label:'Depth of field', min:0, max:1, step:0.01, f:v=> v<0.02?'Off':`f/${(16 - v*14.6).toFixed(1)}`, on:()=>{} },
    { t:'tog', k:'turntable', label:'Turntable', on:()=>{ controls.autoRotate = S.turntable; } },
  ]},
];
const bind = [];
function el(tag, attrs={}, kids=[]){ const e = document.createElement(tag); Object.entries(attrs).forEach(([k,v])=> k==='text'?e.textContent=v:e.setAttribute(k,v)); kids.forEach(k=>e.append(k)); return e; }
SPEC.forEach((sec, si) => {
  const out = el('output'); const s = el('section',{class:'sec'},[el('div',{class:'sec-h'},[el('h2',{text:sec.h}), out])]);
  bind.push(()=> out.textContent = sec.out());
  sec.items.forEach((it, ii) => {
    const id = `c-${it.k || it.t}`;
    let node;
    if (it.t === 'seg'){
      node = el('div',{class:'seg', role:'group', 'aria-label':sec.h});
      it.opts.forEach(([v,l]) => { const b = el('button',{type:'button', text:l}); b.onclick = ()=>{ S[it.k]=v; it.on(); syncUI(); }; node.append(b); bind.push(()=> b.setAttribute('aria-pressed', S[it.k]===v)); });
    } else if (it.t === 'sw'){
      node = el('div',{class:'sw', role:'group', 'aria-label':`${sec.h} options`});
      Object.entries(it.src).forEach(([v,o]) => {
        const b = el('button',{type:'button', title:o.name, 'aria-label':o.name});
        b.style.background = o.swatch === 'transparent' ? 'repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 3px,transparent 3px 7px)' : o.swatch;
        b.onclick = ()=>{ S[it.k]=v; it.on(); syncUI(); }; node.append(b); bind.push(()=> b.setAttribute('aria-pressed', S[it.k]===v));
      });
    } else if (it.t === 'rng'){
      const o = el('output',{for:id}), inp = el('input',{type:'range', id, min:it.min, max:it.max, step:it.step});
      const paint = ()=> inp.style.setProperty('--p', `${(S[it.k]-it.min)/(it.max-it.min)*100}%`);
      inp.oninput = ()=>{ S[it.k] = +inp.value; it.on(); o.textContent = it.f(S[it.k]); paint(); syncHeads(); };
      if (it.done) inp.onchange = ()=> it.done();
      bind.push(()=>{ inp.value = S[it.k]; o.textContent = it.f(S[it.k]); paint(); if (it.dis) inp.disabled = it.dis(); });
      node = el('div',{class:'rng'},[el('label',{for:id, text:it.label}), o, inp]);
    } else if (it.t === 'tog'){
      const b = el('button',{type:'button', id, 'aria-label':it.label});
      b.onclick = ()=>{ S[it.k] = !S[it.k]; it.on(); syncUI(); };
      bind.push(()=> b.setAttribute('aria-pressed', !!S[it.k]));
      node = el('div',{class:'tog'},[el('span',{text:it.label}), b]);
    } else if (it.t === 'text'){
      const inp = el('input',{type:'text', id, maxlength:'28', spellcheck:'false', autocomplete:'off'});
      inp.oninput = ()=>{ S[it.k] = inp.value; it.on(); };
      bind.push(()=>{ if (document.activeElement !== inp) inp.value = S[it.k]; });
      node = el('div',{class:'txt'},[el('label',{for:id, text:it.label}), inp]);
    } else if (it.t === 'file'){
      const inp = el('input',{type:'file', id:'c-file', accept:'image/png,image/svg+xml,image/jpeg,image/webp'});
      inp.onchange = ()=>{ loadArtwork(inp.files[0]); inp.value = ''; };
      const name = el('span',{title:'You can also drop a file onto the stage'});
      bind.push(()=> name.textContent = bdImageName || 'or drop on stage');
      node = el('div',{class:'file'},[el('label',{for:'c-file', text:it.label}), name, inp]);
    }
    if (it.show) bind.push(()=> node.hidden = !it.show());
    s.append(node);
  });
  ctl.append(s);
});
// drop artwork straight onto the stage
const stage = $('#gl');
stage.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dropping'); });
stage.addEventListener('dragleave', () => document.body.classList.remove('dropping'));
stage.addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('dropping'); loadArtwork(e.dataTransfer.files[0]); });
function syncUI(){ bind.forEach(f=>f()); }
function syncHeads(){ document.querySelectorAll('.sec').forEach((s,i)=> s.querySelector('.sec-h output').textContent = SPEC[i].out()); }
function updateReadouts(){
  const w = 2*S.R*(S.sides===0?CIRC:1);
  $('#dims').textContent = `H ${Math.round((S.H+0.13)*MM)} · W ${Math.round(w*MM)} mm · ${(capacity().full/1000).toFixed(2)} L`;
}
let shapeDirty = false;
function scheduleShape(){ shapeDirty = true; floorUniforms.uR.value = S.R; }
function redrawBump(){ drawGlassBump(); }
function rebuildAll(){ rebuildShape(); drawGlassBump(); floorUniforms.uR.value = S.R; }

const shotsNav = $('#shots');
SHOTS.forEach((s,i) => { const b = el('button',{type:'button'}); b.dataset.id = s.id; b.textContent = s.name; b.title = `Key ${i+1}`; b.onclick = ()=> goShot(s.id); shotsNav.append(b); });
addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; const n = +e.key; if (n>=1 && n<=SHOTS.length) goShot(SHOTS[n-1].id); });

$('#detailsBtn').onclick = () => { const h = $('#hud'); h.hidden = !h.hidden; $('#detailsBtn').setAttribute('aria-expanded', !h.hidden); fillHud(); };
$('#sheetToggle').onclick = () => { const r = $('#rail'); const o = r.classList.toggle('open'); $('#sheetToggle').setAttribute('aria-expanded', o); };
$('#resetBtn').onclick = () => { Object.assign(S, structuredClone(DEFAULTS)); controls.autoRotate = false; applyAll(); goShot('hero'); };
$('#snapBtn').onclick = () => { renderFrame(0); $('#snapImg').src = renderer.domElement.toDataURL('image/png'); $('#snap').showModal(); };
$('#snapClose').onclick = () => $('#snap').close();

function applyAll(){ applyBackdrop(); rebuildAll(); applyGlass(); applyClosure(); applyFoil(); applyLight(); applyLiquid(); applyRot(); applyReflect(); syncUI(); }

// ───────────────────────────── loop
const clock = new THREE.Clock();
const _v = new THREE.Vector3(), _w = new THREE.Vector3();
let fpsAcc = 0, fpsN = 0, hudT = 0;
function renderFrame(dt){
  if (shapeDirty){ shapeDirty = false; rebuildShape(); }
  if (tween){ tween.t = Math.min(1, tween.t + dt/tween.dur); applyPose(tween.from, ease(tween.t), tween.to); if (tween.t >= 1) tween = null; }
  controls.update(dt);
  controls.target.y = THREE.MathUtils.clamp(controls.target.y, 0.15, 2.9);
  bg.position.copy(camera.position);
  placeBackdrop();
  renderer.getDrawingBufferSize(size); bgUniforms.uRes.value.copy(size); liquidUniforms.uBehindRes.value.copy(size);
  _v.set(0, S.H*0.42, 0).project(camera); bgUniforms.uHaloC.value.set(_v.x*0.5+0.5, _v.y*0.5+0.5);
  _v.set(0, 0, 0).project(camera); _w.set(0, S.H, 0).project(camera);
  bgUniforms.uHaloSize.value = Math.abs(_w.y - _v.y)*0.5 * LIGHTS[S.light].haloSize;
  // focus on the front skin of the bottle facing the camera
  const toCam = _v.copy(camera.position).sub(controls.target).normalize();
  const fp = _w.copy(controls.target).addScaledVector(toCam, S.R*0.55);
  lens.focus = camera.position.distanceTo(fp);
  lens.aperture = S.aperture;
  lens.enabled = S.aperture > 0.02;
  film.uniforms.uTime.value += dt;
  renderer.info.reset();
  { const mask = camera.layers.mask; camera.layers.set(6);
    renderer.setRenderTarget(behindRT); renderer.clear(); renderer.render(scene, camera); renderer.setRenderTarget(null);
    camera.layers.mask = mask; }
  composer.render(dt);
}
let started = false;
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  renderFrame(dt);
  if (!started){ started = true; setTimeout(()=> $('#veil').classList.add('gone'), 120); }
  fpsAcc += dt; fpsN++; hudT += dt;
  if (hudT > 0.5){
    lastFps = Math.round(fpsN/fpsAcc); fillHud();
    fpsAcc = fpsN = hudT = 0;
  }
}
let lastFps = 0;
function fillHud(){
    const fps = lastFps || '–', i = renderer.info.render;
    if (!$('#hud').hidden) $('#hudStats').innerHTML =
      `Frame <b>${fps} fps</b> · <b>${(i.triangles/1000).toFixed(0)}k</b> triangles · <b>${i.calls}</b> draw calls<br>` +
      `Renderer <b>three.js r${THREE.REVISION}</b>, WebGL2, half-float, 4× MSAA<br>` +
      `Glass <b>transmission</b>, attenuation, dispersion, clearcoat<br>` +
      `Light <b>${LIGHTS[S.light].name}</b> softbox rig, PMREM, rotation ${S.lightRot}°<br>` +
      `Lens <b>${Math.round(S.mm)} mm</b>, gather bokeh at half resolution<br>` +
      `Finish bloom, ACES, grain, vignette, lateral CA`;
}
function resize(){
  const w = innerWidth, h = innerHeight;
  camera.aspect = w/h;
  // keep the bottle in the free stage: left of the rail on desktop, above the shot bar on phones
  const wide = w > 760;
  camera.setViewOffset(w, h, wide ? 126 : 0, wide ? 0 : 56, w, h);
  camera.fov = fovFor(S.mm); camera.updateProjectionMatrix();
  renderer.setSize(w, h, false); composer.setSize(w, h);
  behindRT.setSize(Math.max(1, Math.round(w*DPR/2)), Math.max(1, Math.round(h*DPR/2)));
}
addEventListener('resize', resize);

// ───────────────────────────── boot
(async () => {
  try {
    await Promise.race([ Promise.all(['600 80px "Cormorant Garamond"','700 80px "Cormorant Garamond"','italic 500 80px "Cormorant Garamond"'].map(f=>document.fonts.load(f))), new Promise(r=>setTimeout(r,2500)) ]);
  } catch(e){}
  emblemTex = new THREE.CanvasTexture(drawEmblem()); emblemTex.anisotropy = maxAniso;
  foilMat.alphaMap = emblemTex; foilMat.bumpMap = emblemTex; foilMat.needsUpdate = true;
  bandMat.bumpMap = drawCollar(); bandMat.needsUpdate = true; // drawn after the serif has loaded
  resize();
  applyAll();
  // intro: start wide and ease into the hero shot
  const hero = shotPose(SHOTS[0]);
  camera.fov = fovFor(hero.mm); camera.updateProjectionMatrix();
  controls.target.copy(hero.tgt);
  camera.position.copy(hero.tgt).addScaledVector(new THREE.Vector3(-0.5,0.32,1).normalize(), hero.d*1.5);
  goShot('hero', 2.6);
  loop();
})().catch(e => { console.error(e); fail('The 3D stage could not start: ' + e.message); });
</script>
</body>
